name: MSR Knowledge Base CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "test/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run website tests
        run: node --test tests/test.js
